name: build

on:
  push:
    branches:
      - 'main'
    tags:
    - '**'
  pull_request:
    branches:
    - '**'

jobs:
  tests:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        platform: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          - python-version: '3.10'
            hatch-env: py310
          - python-version: '3.11'
            hatch-env: py311
          - python-version: '3.12'
            hatch-env: py312
          - python-version: '3.13'
            hatch-env: py313
          - python-version: '3.14'
            hatch-env: py314
        # exclude:
        #   - platform: windows-latest
        #     python-version: 3.14

    runs-on: ${{ matrix.platform }}

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip build hatch coverage
    - name: Types
      if: matrix.dev == 'dev'
      run: |
        hatch run +py=${{ matrix.python-version }} dev:types
    - name: Test
      run: |
        hatch run +py=${{ matrix.python-version }} dev:tests
    - name: Upload Results
      if: success()
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage.xml
        flags: unittests
        name: ${{ matrix.platform }}-${{ matrix.hatch-env }}
        token: ${{ secrets.CODECOV_TOKEN }} # required
        fail_ci_if_error: false

  lint:
    strategy:
      max-parallel: 4
      matrix:
        python-version: ['3.14']

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip build hatch
    - name: Lint
      run: |
        python -m hatch run +py=${{ matrix.python-version }} dev:lint

  documents:
    strategy:
      max-parallel: 4
      matrix:
        python-version: ['3.14']

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: '24'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip build hatch
        npm install --legacy-peer-deps
    - name: Install Aspell
      run: |
        sudo apt-get install aspell aspell-en
    - name: Build documents
      run: |
        npm run build
        python -m hatch run docs:spellcheck
